<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Age & Liveness — Camera</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        video, canvas { width: 100%; border-radius: 8px; background: #000; }
        canvas { display: none; }
        .controls { margin-top: 1rem; display: flex; gap: 0.5rem; }
        button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
        .result { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; background: #f5f5f5; }
        .error { background: #ffe0e0; color: #a00; }
        .success { background: #e0ffe0; color: #060; }
        .hint { color: #666; font-size: 0.9rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>Проверка возраста и живности</h1>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <button id="startBtn">Включить камеру</button>
        <button id="snapBtn" disabled>Сделать снимок</button>
    </div>

    <div id="result" class="result" style="display:none;"></div>


<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const resultBox = document.getElementById('result');

let stream = null;

startBtn.addEventListener('click', async () => {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });
        video.srcObject = stream;
        startBtn.disabled = true;
        snapBtn.disabled = false;
    } catch (err) {
        resultBox.style.display = 'block';
        resultBox.className = 'result error';
        resultBox.textContent = 'Не удалось получить доступ к камере: ' + err.message;
    }
});

snapBtn.addEventListener('click', async () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
    if (!blob) return;

    snapBtn.disabled = true;
    resultBox.style.display = 'block';
    resultBox.className = 'result';
    resultBox.textContent = 'Анализ...';

    const form = new FormData();
    form.append('image', blob, 'snapshot.jpg');

    try {
        const resp = await fetch('/api/verify', { method: 'POST', body: form });
        const data = await resp.json();

        if (!resp.ok || data.error) {
            resultBox.className = 'result error';
            resultBox.textContent = 'Ошибка: ' + (data.error || 'неизвестная');
        } else {
            resultBox.className = 'result success';
            const live = data.liveness ? 'Живой' : ' Спуф (фото/экран)';
            resultBox.innerHTML = `
                <p><strong>Liveness:</strong> ${live}</p>
                ${data.liveness ? `
                    <p><strong>Возраст:</strong> ${data.age} лет</p>
                    <p><strong>Live score:</strong> ${data.live_score.toFixed(2)}</p>
                ` : ''}
            `;
        }
    } catch (err) {
        resultBox.className = 'result error';
        resultBox.textContent = 'Ошибка сети: ' + err.message;
    } finally {
        snapBtn.disabled = false;
    }
});
</script>
</body>
</html>
